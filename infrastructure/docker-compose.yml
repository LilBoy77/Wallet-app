services:
  postgres:
    image: postgres:16.8-alpine
    container_name: wallet_app_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_local_only}
      POSTGRES_DB: ${DB_NAME:-wallet_app_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - wallet_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-wallet_app_db}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wallet_pg_data:
    name: wallet_app_pg_data
